name: Papersplainer macOS app

# Builds an UNSIGNED macOS app (Apple silicon) and saves it as a workflow
# artifact. Nothing is published, signed or notarized. Runs only when asked:
# push the commit to build to the `mac-build` branch, or start it by hand
# from the Actions tab. macOS runner minutes are billed at a high multiple
# on private repositories, so this never runs on ordinary pushes.
on:
  push:
    branches: [mac-build]
  workflow_dispatch:

# contents: write lets the last step publish the installer to the "latest-build" release.
permissions:
  contents: write

concurrency:
  group: papersplainer-mac-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  package:
    name: Package (mac-arm64)
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
      # The app icon is an Icon Composer document (build/icon.icon); compiling
      # it needs macOS 26+ and Xcode 26+, as in LearnHarness's release workflow.
      - name: Select Xcode 26+ for the icon compile
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: npm ci
      - run: npm run plugins:setup
      - run: npm run build
      # The same gates LearnHarness's release workflow runs before packaging.
      - run: node scripts/smoke-provider-runtime.mjs
      - run: node scripts/build-server.mjs
      - run: node scripts/smoke-server.mjs --electron
      - name: Package (unsigned, no notarization, no publish)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --mac --arm64 --publish never -c.mac.notarize=false
      - name: Save the app
        uses: actions/upload-artifact@v7
        with:
          name: papersplainer-mac-arm64
          retention-days: 14
          if-no-files-found: error
          path: dist/*.dmg
      - name: Report installed size
        run: |
          app="dist/mac-arm64/Papersplainer.app"
          echo "SIZE app total: $(du -sm "$app" | cut -f1) MB"
          echo "SIZE dmg: $(du -sm dist/*.dmg | cut -f1 | paste -sd+ - | bc) MB"
          du -sm "$app"/Contents/* | sort -rn | sed 's/^/SIZE top: /'
          du -sm "$app"/Contents/Frameworks/* 2>/dev/null | sort -rn | head -6 | sed 's/^/SIZE frameworks: /'
          du -sm "$app"/Contents/Resources/* | sort -rn | head -10 | sed 's/^/SIZE resources: /'
          du -sm "$app"/Contents/Resources/server/standalone/* "$app"/Contents/Resources/server/standalone/.next 2>/dev/null | sort -rn | head -8 | sed 's/^/SIZE standalone: /'
          du -sm "$app"/Contents/Resources/server/standalone/node_modules/* "$app"/Contents/Resources/server/standalone/node_modules/@*/* 2>/dev/null | sort -rn | head -40 | sed 's/^/SIZE module: /'
      # Checks on the packaged app. They run after the app is saved, so a
      # failure here is reported without withholding it.
      - name: Initialize packaged providers offline
        run: |
          app="dist/mac-arm64/Papersplainer.app/Contents"
          node scripts/smoke-provider-runtime.mjs --standalone "$app/Resources/server/standalone"
          node scripts/smoke-provider-runtime.mjs --standalone "$app/Resources/server/standalone" --runtime "$app/MacOS/Papersplainer"
      - name: Exercise packaged demo runtime
        run: |
          app="dist/mac-arm64/Papersplainer.app/Contents"
          node scripts/smoke-demo-runtime.mjs --standalone "$app/Resources/server/standalone" --runtime "$app/MacOS/Papersplainer" --browser
      # Runs last, so only a build that passed the packaged-app checks is
      # published. One rolling release with fixed file names gives a permanent
      # download link. It is marked a pre-release so the app's update check,
      # which reads the newest full release, keeps finding nothing.
      - name: Publish to the latest-build release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          installer=$(ls dist/*.dmg | head -1)
          cp "$installer" "Papersplainer-mac-arm64.dmg"
          gh release view latest-build >/dev/null 2>&1 || gh release create latest-build --prerelease --target "$GITHUB_SHA" \
            --title "Latest build" --notes "Newest installers, replaced by every successful build." || true
          gh release upload latest-build "Papersplainer-mac-arm64.dmg" --clobber
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/latest-build" -f sha="$GITHUB_SHA" -F force=true >/dev/null
          echo "Mac (Apple silicon): built from $GITHUB_REF_NAME at ${GITHUB_SHA:0:7} on $(date -u +%Y-%m-%d)" > "Papersplainer-mac-arm64.dmg.txt"
          gh release upload latest-build "Papersplainer-mac-arm64.dmg.txt" --clobber
