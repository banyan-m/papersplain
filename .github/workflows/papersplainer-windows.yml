name: Papersplainer Windows installer

# Builds an unsigned Windows installer and saves it as a workflow artifact.
# Nothing is published. Runs only when asked: push the commit to build to
# the `windows-build` branch, or start it by hand from the Actions tab.
on:
  push:
    branches: [windows-build]
  workflow_dispatch:

# contents: write lets the last step publish the installer to the "latest-build" release.
permissions:
  contents: write

concurrency:
  group: papersplainer-windows-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  package:
    name: Package (windows-x64)
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
      - run: npm ci
      - run: npm run plugins:setup
      - run: npm run build
      # The same gates LearnHarness's release workflow runs before packaging.
      - run: node scripts/smoke-provider-runtime.mjs
      - run: node scripts/build-server.mjs
      - run: node scripts/smoke-server.mjs --electron
      - name: Package (no publish)
        run: npx electron-builder --win --x64 --publish never
      - name: Save the installer
        uses: actions/upload-artifact@v7
        with:
          name: papersplainer-windows-x64
          retention-days: 14
          if-no-files-found: error
          path: dist/*.exe
      - name: Report installed size
        run: |
          app="dist/win-unpacked"
          echo "SIZE app total: $(du -sm "$app" | cut -f1) MB"
          echo "SIZE installer: $(du -sm dist/*.exe | cut -f1 | paste -sd+ - | bc) MB"
          du -sm "$app"/* | sort -rn | head -8 | sed 's/^/SIZE top: /'
          du -sm "$app"/resources/* | sort -rn | head -8 | sed 's/^/SIZE resources: /'
          du -sm "$app"/resources/server/standalone/node_modules/* "$app"/resources/server/standalone/node_modules/@*/* 2>/dev/null | sort -rn | head -40 | sed 's/^/SIZE module: /'
      # Checks on the packaged app. They run after the installer is saved, so
      # a failure here is reported without withholding the installer.
      - name: Initialize packaged providers offline
        run: |
          payload="dist/win-unpacked/resources/server/standalone"
          node scripts/smoke-provider-runtime.mjs --standalone "$payload"
          node scripts/smoke-provider-runtime.mjs --standalone "$payload" --runtime "dist/win-unpacked/Papersplainer.exe"
      - name: Exercise packaged demo runtime
        run: node scripts/smoke-demo-runtime.mjs --standalone dist/win-unpacked/resources/server/standalone --runtime dist/win-unpacked/Papersplainer.exe --browser
      # Runs last, so only a build that passed the packaged-app checks is
      # published. One rolling release with fixed file names gives a permanent
      # download link. It is marked a pre-release so the app's update check,
      # which reads the newest full release, keeps finding nothing.
      - name: Publish to the latest-build release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          installer=$(ls dist/*setup.exe | head -1)
          cp "$installer" "Papersplainer-windows-x64-setup.exe"
          gh release view latest-build >/dev/null 2>&1 || gh release create latest-build --prerelease --target "$GITHUB_SHA" \
            --title "Latest build" --notes "Newest installers, replaced by every successful build." || true
          gh release upload latest-build "Papersplainer-windows-x64-setup.exe" --clobber
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/latest-build" -f sha="$GITHUB_SHA" -F force=true >/dev/null
          echo "Windows: built from $GITHUB_REF_NAME at ${GITHUB_SHA:0:7} on $(date -u +%Y-%m-%d)" > "Papersplainer-windows-x64-setup.exe.txt"
          gh release upload latest-build "Papersplainer-windows-x64-setup.exe.txt" --clobber
