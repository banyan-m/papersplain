name: Papersplainer Windows installer

# Builds an unsigned Windows installer and saves it as a workflow artifact.
# Nothing is published. Runs only when asked: push the commit to build to
# the `windows-build` branch, or start it by hand from the Actions tab.
on:
  push:
    branches: [windows-build]
  workflow_dispatch:

# contents: write lets the last step publish the installer to the "latest-build" release.
permissions:
  contents: write

concurrency:
  group: papersplainer-windows-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  package:
    name: Package (windows-x64)
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
      - run: npm ci
      - run: npm run plugins:setup
      - run: npm run build
      # The same gates LearnHarness's release workflow runs before packaging.
      - run: node scripts/smoke-provider-runtime.mjs
      - run: node scripts/build-server.mjs
      - run: node scripts/smoke-server.mjs --electron
      # Every build gets a higher version (0.7.<run number>) so installed
      # apps recognise it as an update. Only the packaged app's version
      # changes; package.json in the repo stays as it is.
      - name: Package (no publish)
        run: npx electron-builder --win --x64 --publish never -c.extraMetadata.version="0.7.${GITHUB_RUN_NUMBER}"
      - name: Save the installer
        uses: actions/upload-artifact@v7
        with:
          name: papersplainer-windows-x64
          retention-days: 14
          if-no-files-found: error
          path: dist/*.exe
      - name: Report installed size
        run: |
          app="dist/win-unpacked"
          echo "SIZE app total: $(du -sm "$app" | cut -f1) MB"
          echo "SIZE installer: $(du -sm dist/*.exe | cut -f1 | paste -sd+ - | bc) MB"
          du -sm "$app"/* | sort -rn | head -8 | sed 's/^/SIZE top: /'
          du -sm "$app"/resources/* | sort -rn | head -8 | sed 's/^/SIZE resources: /'
          du -sm "$app"/resources/server/standalone/node_modules/* "$app"/resources/server/standalone/node_modules/@*/* 2>/dev/null | sort -rn | head -40 | sed 's/^/SIZE module: /'
      # Checks on the packaged app. They run after the installer is saved, so
      # a failure here is reported without withholding the installer.
      - name: Initialize packaged providers offline
        run: |
          payload="dist/win-unpacked/resources/server/standalone"
          node scripts/smoke-provider-runtime.mjs --standalone "$payload"
          node scripts/smoke-provider-runtime.mjs --standalone "$payload" --runtime "dist/win-unpacked/Papersplainer.exe"
      - name: Exercise packaged demo runtime
        run: node scripts/smoke-demo-runtime.mjs --standalone dist/win-unpacked/resources/server/standalone --runtime dist/win-unpacked/Papersplainer.exe --browser
      # Runs last, so only a build that passed the packaged-app checks is
      # published. One rolling release holds the newest installer under a
      # fixed name (a permanent download link) and the update feed installed
      # Windows apps read: latest.yml plus the installer it names. It is a
      # pre-release; the app reads it by direct URL (electron/main.cjs).
      - name: Publish to the latest-build release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          installer=$(ls dist/*setup.exe | head -1)
          name=$(basename "$installer")
          # electron-builder writes latest.yml when it knows where updates
          # are published; write it here if it did not.
          if [ ! -f dist/latest.yml ]; then
            node -e '
              const fs = require("fs"), crypto = require("crypto");
              const [file, name, version] = process.argv.slice(1);
              const data = fs.readFileSync(file);
              const sha512 = crypto.createHash("sha512").update(data).digest("base64");
              fs.writeFileSync("dist/latest.yml", [
                `version: ${version}`, "files:", `  - url: ${name}`, `    sha512: ${sha512}`, `    size: ${data.length}`,
                `path: ${name}`, `sha512: ${sha512}`, `releaseDate: \x27${new Date().toISOString()}\x27`, "",
              ].join("\n"));
            ' "$installer" "$name" "0.7.${GITHUB_RUN_NUMBER}"
          fi
          cat dist/latest.yml
          grep -q "$name" dist/latest.yml
          cp "$installer" "Papersplainer-windows-x64-setup.exe"
          gh release view latest-build >/dev/null 2>&1 || gh release create latest-build --prerelease --target "$GITHUB_SHA" \
            --title "Latest build" --notes "Newest installers, replaced by every successful build." || true
          # The installer first, the feed last: an app that reads the new
          # latest.yml must find the file it names.
          gh release upload latest-build "$installer" --clobber
          if [ -f "$installer.blockmap" ]; then gh release upload latest-build "$installer.blockmap" --clobber; fi
          gh release upload latest-build "Papersplainer-windows-x64-setup.exe" --clobber
          gh release upload latest-build dist/latest.yml --clobber
          # Drop the versioned installers of earlier builds.
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/latest-build" --jq '.assets[] | "\(.id) \(.name)"' | while read -r id asset; do
            case "$asset" in
              "$name"|"$name.blockmap") ;;
              Papersplainer-0.*-x64-setup.exe|Papersplainer-0.*-x64-setup.exe.blockmap) gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$id" >/dev/null ;;
            esac
          done
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/latest-build" -f sha="$GITHUB_SHA" -F force=true >/dev/null
          echo "Windows: version 0.7.${GITHUB_RUN_NUMBER}, built from $GITHUB_REF_NAME at ${GITHUB_SHA:0:7} on $(date -u +%Y-%m-%d)" > "Papersplainer-windows-x64-setup.exe.txt"
          gh release upload latest-build "Papersplainer-windows-x64-setup.exe.txt" --clobber
