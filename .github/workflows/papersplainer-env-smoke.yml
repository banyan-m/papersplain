name: Papersplainer setup check

# Runs the app's first-launch setup on real Windows and macOS machines:
# installs the Manim environment from scratch, renders an animation, and
# makes a toy dataset in the Python sandbox. No packaging. Runs only when
# asked: push to the `env-smoke` branch, or start it by hand.
on:
  push:
    branches: [env-smoke]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: papersplainer-env-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Setup check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
      - run: npm ci
      - name: First-launch setup, render, toy data
        run: |
          export LH_DATA_DIR="$RUNNER_TEMP/pp-smoke-data"
          rm -rf "$LH_DATA_DIR" && mkdir -p "$LH_DATA_DIR"
          if [ "$RUNNER_OS" = "macOS" ]; then
            # An ordinary Mac has no Homebrew, compiler toolchain on PATH, or
            # pkg-config. Hide the runner's so the check fails if setup needs them.
            export PATH="$(dirname "$(command -v node)"):/usr/bin:/bin:/usr/sbin:/sbin"
            unset PKG_CONFIG_PATH HOMEBREW_PREFIX
          fi
          npx tsx scripts/smoke-render-env.ts
